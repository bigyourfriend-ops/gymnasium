<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ғани Мұратбаев атындағы гимназия</title>
<link rel="icon" href="logo.png">
<style>
:root{--g:#15803d;--gd:#14532d;--ink:#0f172a;--mut:#475569;--bg:#f0fdf4}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 10%,#dcfce7 0,transparent 45%),radial-gradient(circle at 85% 90%,#d1fae5 0,transparent 40%),var(--bg)}
.card{width:100%;max-width:560px;background:#fff;border:1px solid #d1fae5;border-radius:20px;padding:40px 28px;text-align:center;box-shadow:0 20px 50px -24px rgba(20,83,45,.35)}
img{width:112px;height:112px;object-fit:contain}
h1{font-size:22px;line-height:1.3;margin:18px 0 4px;color:var(--gd)}
.sub{color:var(--mut);font-size:14px}
.msg{margin:26px 0;display:grid;gap:10px}
.msg p{font-size:16px;line-height:1.45}
.msg p:first-child{font-weight:700;font-size:18px;color:var(--g)}
.msg p+p{color:var(--mut);font-size:14.5px}
.ct{border-top:1px solid #e2e8f0;padding-top:20px;display:grid;gap:6px;font-size:14.5px}
a{color:var(--g);text-decoration:none;font-weight:600}
footer{margin-top:20px;font-size:12.5px;color:var(--mut)}
</style>
</head>
<body>
<main class="card">
  <img src="logo.png" alt="Логотип гимназии">
  <h1>Ғани Мұратбаев атындағы гимназия</h1>
  <p class="sub">Жамбыл облысы, Байзақ ауданы, Сарыкемер ауылы</p>
  <div class="msg">
    <p>Сайт әзірленуде. Жақында ашылады!</p>
    <p>Сайт в разработке. Скоро откроется!</p>
    <p>The website is under construction. Coming soon!</p>
  </div>
  <div class="ct">
    <span>☎ <a href="tel:+77263721937">+7 (72637) 2-19-37</a></span>
    <span>✉ <a href="mailto:sh-g.gany.muratbaeva@mail.ru">sh-g.gany.muratbaeva@mail.ru</a></span>
  </div>
</main>
<footer>© 2026 gmonline.kz</footer>
</body>
</html>
