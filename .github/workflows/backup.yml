# Еженедельная резервная копия сайта: база данных Supabase (вместе с пользователями),
# все фото и PDF из хранилища и код сайта — одним зашифрованным ZIP-архивом.
#
# Запуск: автоматически каждое воскресенье в 02:00 (Кызылорда) или вручную:
# GitHub → Actions → «Резервная копия сайта» → Run workflow.
# Готовая копия: открыть запуск → внизу «Artifacts» → gmonline-backup-ДАТА (хранится 90 дней).
# Открыть архив: 7-Zip или WinRAR, пароль — значение секрета BACKUP_PASSWORD.
#
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL  — строка подключения Supabase: Dashboard → Connect → «Session pooler» → URI
#                      (с вставленным паролем базы данных вместо [YOUR-PASSWORD])
#   BACKUP_PASSWORD  — придумайте надёжный пароль для архива и запишите его в надёжном месте
name: Резервная копия сайта

on:
  schedule:
    - cron: "0 21 * * 6"   # воскресенье 02:00 по Кызылорде (UTC+5)
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # чтобы GitHub не отключил расписание через 60 дней без коммитов

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Проверка секретов
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PW: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          if [ -z "$DB" ] || [ -z "$PW" ]; then
            echo "::error::Добавьте секреты SUPABASE_DB_URL и BACKUP_PASSWORD (Settings → Secrets and variables → Actions). Инструкция — в начале файла .github/workflows/backup.yml"
            exit 1
          fi

      - name: Установка pg_dump 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Выгрузка базы данных
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p out/database
          PGDUMP=/usr/lib/postgresql/17/bin/pg_dump
          # таблицы сайта: структура + данные
          $PGDUMP "$DB" --schema=public --no-owner --no-privileges -f out/database/public.sql
          # учётные записи и список файлов (только данные; если нет прав — копия всё равно создаётся)
          $PGDUMP "$DB" --data-only --no-owner --no-privileges -t auth.users -t auth.identities -f out/database/auth-users.sql \
            || echo "::warning::Не удалось выгрузить auth.users — копия без учётных записей"
          $PGDUMP "$DB" --data-only --no-owner --no-privileges -t storage.buckets -t storage.objects -f out/database/storage.sql \
            || echo "::warning::Не удалось выгрузить список файлов хранилища"
          # содержимое сайта отдельно в JSON — его можно загрузить через «Әкімші панелі → Сақтық көшірме»
          psql "$DB" -At -c "select coalesce(json_agg(json_build_object('id',id,'data',data,'updated_at',updated_at)),'[]') from public.site_content" > out/database/site_content.json
          ls -la out/database

      - name: Скачивание фото и PDF
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          BASE=$(grep -o 'supabaseUrl: *"[^"]*"' config.js | sed 's/.*"\(.*\)"/\1/')
          mkdir -p out/media
          psql "$DB" -At -c "select name from storage.objects where bucket_id='media' order by name" > names.txt
          ok=0; bad=0
          while IFS= read -r n; do
            [ -z "$n" ] && continue
            enc=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$n")
            if curl -sSf --retry 3 --create-dirs -o "out/media/$n" "$BASE/storage/v1/object/public/media/$enc"; then ok=$((ok+1)); else bad=$((bad+1)); echo "::warning::Не скачался файл $n"; fi
          done < names.txt
          echo "Файлов скачано: $ok, ошибок: $bad"
          du -sh out/media

      - name: Код сайта
        run: git archive --format=zip -o out/site-code.zip HEAD

      - name: Шифрование архива
        env:
          PW: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          D=$(TZ=Asia/Qyzylorda date +%Y-%m-%d)
          echo "D=$D" >> "$GITHUB_ENV"
          cat > out/README.txt <<TXT
          Резервная копия сайта gmonline.kz от $D
          database/public.sql       — таблицы сайта (структура и данные)
          database/auth-users.sql   — учётные записи пользователей (пароли зашифрованы)
          database/storage.sql      — список файлов хранилища
          database/site_content.json — содержимое сайта (можно восстановить через админку)
          media/                    — все фото и PDF
          site-code.zip             — код сайта
          TXT
          cd out && 7z a -tzip -mem=AES256 -p"$PW" "../gmonline-backup-$D.zip" . > /dev/null
          ls -la ../gmonline-backup-$D.zip

      - uses: actions/upload-artifact@v4
        with:
          name: gmonline-backup-${{ env.D }}
          path: gmonline-backup-${{ env.D }}.zip
          retention-days: 90
          compression-level: 0

      - name: Не давать GitHub отключить расписание
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/backup.yml/enable" || true
