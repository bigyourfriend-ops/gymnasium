# Выгрузка сайта на хостинг PS.kz (gmonline.kz) по FTP.
# Запуск вручную: GitHub → Actions → «Выгрузка на gmonline.kz» → Run workflow.
# Нужны секреты репозитория: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# (домашняя папка FTP-учётки — /httpdocs).
name: Выгрузка на gmonline.kz

on:
  workflow_dispatch:

concurrency:
  group: deploy-pskz
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка секретов
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$S" ] || [ -z "$U" ] || [ -z "$P" ]; then
            echo "::error::Добавьте секреты FTP_SERVER, FTP_USERNAME и FTP_PASSWORD (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Выгрузка файлов по FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            supabase/**
            README.md
